<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Predictions</title>
<meta name="description" content="A private F1 prediction game for friends.">
<meta name="theme-color" content="#0C0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1 Predictions">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700;1,800&display=swap">
<style>
/* Layout concept: a race-control timing screen. Carbon-dark ground, F1 red for action,
   sector colours for state (purple = leader, green = scored, yellow = warning).
   Every player has a fixed colour that follows them from the tower to the chart.
   The memorable moment is the start-lights countdown beside the track outline. */
:root {
  --bg: #0C0D12;
  --surface: #15171F;
  --surface-2: #1F222D;
  --ink: #F2F3F7;
  --muted: #9AA1B4;
  --line: #2A2E3B;
  --accent: #E10600;
  --accent-fg: #FF4B3E;
  --accent-ink: #FFFFFF;
  --accent-soft: #34130F;
  --purple: #C77DFF;
  --hit: #2BD67F;
  --hit-soft: #10291D;
  --warn: #FFD23F;
  --warn-soft: #332A0A;
  --miss: #7B8296;
  --bad: #FF7A6E;
  --track: #F2F3F7;
  --track-edge: #2F3342;
  --shadow: rgba(0, 0, 0, .45);
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ECEDF2; --surface: #FFFFFF; --surface-2: #E3E5ED; --ink: #0C0D12; --muted: #565C70; --line: #CBCFDB;
    --accent: #D10600; --accent-fg: #C20500; --accent-ink: #FFFFFF; --accent-soft: #FBE3E0;
    --purple: #7B2FB5; --hit: #0B7A45; --hit-soft: #D6F1E3; --warn: #7A5600; --warn-soft: #FFEFC0; --miss: #6D7389; --bad: #B3261E;
    --track: #0C0D12; --track-edge: #CBCFDB; --shadow: rgba(20, 24, 40, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ECEDF2; --surface: #FFFFFF; --surface-2: #E3E5ED; --ink: #0C0D12; --muted: #565C70; --line: #CBCFDB;
  --accent: #D10600; --accent-fg: #C20500; --accent-ink: #FFFFFF; --accent-soft: #FBE3E0;
  --purple: #7B2FB5; --hit: #0B7A45; --hit-soft: #D6F1E3; --warn: #7A5600; --warn-soft: #FFEFC0; --miss: #6D7389; --bad: #B3261E;
  --track: #0C0D12; --track-edge: #CBCFDB; --shadow: rgba(20, 24, 40, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.wrap { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.disp, .card h2, .card h3, .grp-h h3, .pos, .pts, .count, .b-name, h1, .tabs button, .btn.primary, .chip .rn { font-family: var(--font-display); font-style: italic; text-transform: uppercase; }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { display: block; background: var(--accent); color: var(--accent-ink); transform: skewX(-12deg); padding: 2px 14px 2px 12px; border-radius: 3px; }
.mark b { display: block; transform: skewX(12deg); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 38px; line-height: 1.1; letter-spacing: .01em; }
h1 { font-weight: 800; font-size: 34px; line-height: .95; letter-spacing: .01em; }
.season { font-size: 14px; color: var(--muted); font-weight: 500; }
.flag { height: 12px; background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 12px 12px; opacity: .9; border-radius: 2px; }
.who { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; min-height: 40px; }
.who .badge { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 16px; }
.who .nm { font-weight: 600; font-size: 14px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 18px; font-weight: 700; font-size: 21px; letter-spacing: .02em; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; min-height: 48px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 520px) { .tabs button { padding: 10px 9px; font-size: 17px; letter-spacing: 0; } .tabs { justify-content: space-between; } }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: .01em; }
.card h2::before { content: ""; display: inline-block; width: 7px; height: .78em; background: var(--accent); transform: skewX(-14deg); margin-right: 10px; }
.card h3 { font-weight: 700; font-size: 20px; letter-spacing: .02em; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

/* progress strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(8px, 1fr)); gap: 3px; }
.strip i { height: 10px; border-radius: 1px; background: var(--surface-2); transform: skewX(-20deg); }
.strip i.done { background: var(--accent); }
.strip i.open { background: var(--warn); }

/* race banner, start lights, track map */
.banner { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.b-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 auto; }
.b-round { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 18px; color: var(--accent-fg); letter-spacing: .04em; text-transform: uppercase; }
.card .b-name { font-weight: 800; font-size: 44px; line-height: .95; text-wrap: balance; }
.card .b-name::before { content: none; }
.trackbox { flex: 0 0 auto; width: 168px; height: 150px; }
.track { width: 100%; height: 100%; display: block; }
.track .u, .track .t { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.track .u { stroke: var(--track-edge); stroke-width: 13; }
.track .t { stroke: var(--track); stroke-width: 4.5; }
@media (max-width: 520px) { .trackbox { width: 118px; height: 116px; } .card .b-name { font-size: 36px; } }
.lockp { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 6px 0; }
.lights { display: inline-flex; gap: 7px; }
.lights i { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); display: block; }
.lights i.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px 2px rgba(225, 6, 0, .55); }
.count { font-weight: 800; font-size: 32px; line-height: 1; display: block; letter-spacing: .01em; }

/* standings tower */
.tower { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tower li { border-top: 1px solid var(--line); }
.tower li:first-child { border-top: 0; }
.t-row, .t-head { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr) 3.6rem 3.8rem; gap: 8px; align-items: center; }
.t-row { width: 100%; background: none; border: 0; text-align: left; padding: 8px 14px; min-height: 52px; }
.t-row[aria-expanded="true"] { background: var(--surface-2); }
.t-row.me { background: var(--accent-soft); }
.t-head { padding: 8px 14px; font-weight: 600; font-size: 13px; color: var(--muted); background: var(--surface-2); }
.t-head span:nth-child(n+3), .t-row .r { text-align: right; }
.int { display: none; }
@media (min-width: 560px) { .t-row, .t-head { grid-template-columns: 2.8rem minmax(0, 1fr) 4rem 4rem 4.2rem; } .int { display: block; } }
.pos { display: grid; place-items: center; height: 34px; border-radius: 3px; background: var(--surface-2); font-weight: 800; font-size: 22px; }
.t-row[aria-expanded="true"] .pos, .t-row.me .pos { background: var(--bg); }
.pos.lead { background: var(--accent) !important; color: var(--accent-ink); }
.t-row .pname { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
.stripe { width: 5px; height: 26px; border-radius: 2px; flex: none; transform: skewX(-12deg); }
.nm-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pname small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.you { font-style: normal; font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 1px 6px; flex: none; }
.pts { font-weight: 800; font-size: 26px; }
.gap { color: var(--muted); font-size: 14px; }
.detail { padding: 6px 14px 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 84px; overflow-x: auto; padding-bottom: 2px; }
.bar { flex: 1 0 13px; max-width: 34px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
.bar b { display: block; width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
.bar.zero b { background: var(--line); }
.bar span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }

/* chart */
.mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mode button { min-height: 44px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.mode button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bg { stroke: var(--muted); stroke-opacity: .35; stroke-width: 1.2; fill: none; }
.chart .ln { fill: none; stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
.chart .lbl { font-weight: 700; font-size: 11px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 8px; min-height: 38px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.pchip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink); }
.pchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; opacity: .55; }
.pchip[aria-pressed="true"] i { opacity: 1; }

/* round chips and pills */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 12px; min-height: 52px; min-width: 76px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.chip .rn { font-weight: 700; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.chip .nm { font-weight: 600; font-size: 15px; }
.chip .wk { font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent-fg); background: var(--accent-soft); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--line); }
.chip .dot.done { background: var(--hit); } .chip .dot.open { background: var(--accent-fg); } .chip .dot.locked { background: var(--warn); }
a { color: var(--accent-fg); }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill.hit { background: var(--hit-soft); color: var(--hit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent-fg); }

/* results and pick tables */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 20px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 5px; min-width: 0; }
.kv dt, .kv dd { margin: 0; } .kv dt { color: var(--muted); font-size: 14px; } .kv dd { font-weight: 600; text-align: right; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist > li { border-top: 1px solid var(--line); }
.plist > li:first-child { border-top: 0; }
.pl-row { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; background: none; border: 0; text-align: left; padding: 10px 0; min-height: 48px; }
.pl-row .pname { font-weight: 600; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; }
.prow .pname { font-weight: 600; flex: 1 1 150px; }
.prow .btn { min-height: 40px; padding: 6px 12px; }
.who[hidden] { display: none; }
.pick-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 8px; }
.pick-table th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 4px 6px; }
.pick-table td { padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.pick-table td.p { text-align: right; font-weight: 700; white-space: nowrap; }
.pick-table tr.hit td { background: var(--hit-soft); }
.pick-table tr.hit td.p { color: var(--hit); }
.pick-table tr.miss td:nth-child(2) { color: var(--miss); text-decoration: line-through; text-decoration-thickness: 1px; }
.pick-table tr.pending td, .pick-table tr.none td { color: var(--muted); }
.scroll-x { overflow-x: auto; }

/* forms */
.grp { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
.grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.grp-c { font-size: 13px; color: var(--muted); font-weight: 600; }
.fgrid { display: grid; grid-template-columns: 1fr; column-gap: 28px; }
@media (min-width: 720px) { .fgrid { grid-template-columns: 1fr 1fr; } .fgrid .podium { grid-column: 1 / -1; } }
.field { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; min-width: 0; }
.field label, .field .lbl { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.field .rule { font-size: 13px; color: var(--muted); }
.field select, .field input[type="number"], .field input[type="datetime-local"], .field input[type="text"], .field input[type="date"], .field textarea, .sel {
  width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background-color: var(--surface-2); color: var(--ink);
}
.field textarea { font-family: var(--font-body); }
.field input[type="date"], .field input[type="datetime-local"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; text-align: left; line-height: 1.2; }
.field input[type="date"]::-webkit-date-and-time-value, .field input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; min-width: 0; margin: 0; }
select { appearance: none; -webkit-appearance: none; padding-right: 38px !important;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 21px) 50%, calc(100% - 15px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
select[data-empty="1"]:not(:disabled), input[data-empty="1"]:not(:disabled) { border-style: dashed; border-color: var(--muted); }
select:disabled, input:disabled { opacity: .7; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .trio { grid-template-columns: 1fr; } }
.pod { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { min-height: 48px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { min-height: 46px; padding: 8px 20px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 20px; letter-spacing: .03em; padding-inline: 26px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status { font-size: 14px; color: var(--muted); }
.status.ok { color: var(--hit); } .status.bad { color: var(--bad); }
.notice { border-radius: 4px; padding: 10px 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; border-left: 4px solid var(--warn); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.picker button { min-height: 50px; text-align: left; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.picker button small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.tog { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 6px 12px; min-height: 44px; font-weight: 600; font-size: 14px; }
.tog[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); text-decoration: line-through; }
.togs { display: flex; flex-wrap: wrap; gap: 6px; }
.savebar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 4; display: flex; align-items: center; gap: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; box-shadow: 0 -10px 24px var(--shadow); }
.sb-main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; }
.savebar .btn.primary { flex: none; min-height: 48px; }
@media (max-width: 520px) { .savebar .btn.primary { padding-inline: 18px; font-size: 18px; } }
.prog { font-weight: 700; font-size: 15px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar b, .meter i { transition: height .25s ease, width .25s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark"><b>F1</b></span>
      <div><h1>Predictions</h1><div class="season" id="season-label">Season 2026</div></div>
    </div>
    <div class="who" id="who" hidden></div>
  </header>
  <div class="flag" aria-hidden="true"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view" class="stack" aria-live="polite"></main>
  <p class="foot">Other players' picks stay hidden until the cut-off. Track outlines: bacinger/f1-circuits (MIT). <a href="#" id="signout">Sign out</a></p>
</div>

<script src="config.js"></script>
<script>
/* Connection layer. Gives the page the same small database interface it used on claude.ai,
   but backed by Supabase functions (see setup.sql). The secret code is checked on the server
   for every call; nothing here decides who may see or change what. */
(function () {
  'use strict';
  var cfg = window.F1_CONFIG || {};
  var KEY = 'f1code', mem = '';
  function getCode() { try { return localStorage.getItem(KEY) || mem; } catch (e) { return mem; } }
  function setCode(c) { mem = c; try { localStorage.setItem(KEY, c); } catch (e) {} }
  function clearCode() { mem = ''; try { localStorage.removeItem(KEY); } catch (e) {} }
  var code = '';

  function rpc(fn, args) {
    return fetch(cfg.url + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: { apikey: cfg.key, 'Content-Type': 'application/json' }, body: JSON.stringify(args)
    }).then(function (res) {
      return res.text().then(function (t) {

  { key:'conLoser',  label:'Constructors championship loser', pts:8, type:'team' },

const same = (a,b) => {
  if (a == null || b == null) return false;
  if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
  return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
};
// Returns { total, items: {key: {pts, state}} } state: 'hit' | 'miss' | 'pending' | 'none'
function scoreRace(picks, results) {
  picks = picks || {}; results = results || {};
  const items = {}; let total = 0;
  const podium = ['pod1','pod2','pod3'].map(k => results[k]).filter(v => v != null);
  const seen = [];
  for (const c of CATS) {
    const pick = picks[c.key], res = results[c.key];
    let state, pts = 0;
    if (res == null) state = 'pending';
    else if (pick == null) state = 'none';
    else if (c.group === 'podium') {
      const dup = seen.some(s => same(s, pick));
      seen.push(pick);

    items[c.key] = { pts, state };
  }
  return { total, items };
}
// Pre-season: closest pit stop time wins; ties all score.
function scoreSeason(allPicks, results) {
  const out = {};
  for (const [pid, picks] of Object.entries(allPicks || {})) {
    let total = 0; const items = {};
    for (const c of SEASON) {
      const pick = picks[c.key], res = (results||{})[c.key];
      let state = 'pending', pts = 0;
      if (res != null) {
        if (pick == null) state = 'none';
        else if (c.type === 'time') {
          const diffs = Object.values(allPicks).map(p => p[c.key]).filter(v => v != null).map(v => Math.abs(Number(v) - Number(res)));
          const best = Math.min(...diffs);
          state = Math.abs(Number(pick) - Number(res)) === best ? 'hit' : 'miss';

        if (state === 'hit') { pts = c.pts; total += pts; }
      }
      items[c.key] = { pts, state };
    }
    out[pid] = { total, items };
  }
  return out;
}
